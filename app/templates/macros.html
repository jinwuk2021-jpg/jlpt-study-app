{% macro level_badge(level) %}
<span class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-semibold
  {% if level == 'N5' %}bg-emerald-100 text-emerald-700
  {% elif level == 'N4' %}bg-teal-100 text-teal-700
  {% elif level == 'N3' %}bg-blue-100 text-blue-700
  {% elif level == 'N2' %}bg-indigo-100 text-indigo-700
  {% else %}bg-purple-100 text-purple-700{% endif %}">{{ level }}</span>
{% endmacro %}

{% macro btn_primary(text, href='#', extra='') %}
<a href="{{ href }}" class="inline-flex items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-brand-600 to-indigo-600 px-6 py-3 text-sm font-semibold text-white shadow-lg hover:-translate-y-0.5 transition-all {{ extra }}">{{ text }}</a>
{% endmacro %}

{% macro progress_bar(value, max=100) %}
{% set pct = (value / max * 100) if max > 0 else 0 %}
{% if pct > 100 %}{% set pct = 100 %}{% endif %}
<div class="w-full h-2.5 rounded-full bg-gray-100 overflow-hidden">
  <div class="h-full rounded-full bg-gradient-to-r from-brand-500 to-indigo-500 transition-all" style="width: {{ pct }}%"></div>
</div>
{% endmacro %}
