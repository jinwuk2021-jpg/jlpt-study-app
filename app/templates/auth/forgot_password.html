{% extends "auth/base_auth.html" %}
{% block auth_title %}Forgot Password{% endblock %}
{% block auth_content %}
{% if sent %}
<div class="text-center">
  <div class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-full bg-emerald-100 text-emerald-600 text-2xl">✉</div>
  <h1 class="text-2xl font-bold">Check your email</h1>
  <p class="mt-2 text-sm text-gray-500">Reset link sent to <strong>{{ email }}</strong></p>
  <a href="{{ url_for('auth.login') }}" class="inline-block mt-6 text-sm text-brand-600">← Back to login</a>
</div>
{% else %}
<a href="{{ url_for('auth.login') }}" class="text-sm text-gray-500 hover:text-gray-700">← Back to login</a>
<h1 class="text-2xl font-bold mt-4">Forgot password?</h1>
<form method="POST" class="mt-8 space-y-4">
  <input type="email" name="email" required placeholder="you@example.com" class="w-full rounded-xl border border-gray-200 px-4 py-3 text-sm">
  <button type="submit" class="w-full rounded-xl bg-gradient-to-r from-brand-600 to-indigo-600 px-6 py-3 text-sm font-semibold text-white">Send Reset Link</button>
</form>
{% endif %}
{% endblock %}
