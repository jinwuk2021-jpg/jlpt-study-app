{% extends "base.html" %}
{% block title %}Chọn trình độ — NihongoMaster{% endblock %}
{% block body %}
<div class="min-h-screen bg-slate-50 flex flex-col items-center justify-center p-5"
     x-data="{ selected: '' }">

  <!-- Logo + heading -->
  <div class="text-center mb-8">
    <div class="inline-flex h-12 w-12 items-center justify-center rounded-2xl bg-brand-600 text-white font-bold text-xl mb-4 shadow-lg">日</div>
    <h1 class="text-2xl font-bold text-gray-900">Bạn đang học JLPT cấp nào?</h1>
    <p class="text-sm text-gray-500 mt-1.5 max-w-sm mx-auto">Chọn trình độ để app hiển thị nội dung phù hợp. Có thể thay đổi sau trong Cài đặt.</p>
  </div>

  <!-- Level cards -->
  <form method="POST" class="w-full max-w-2xl" @submit.prevent="selected ? $el.submit() : null">
    <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-3 mb-6">

      <!-- N5 -->
      <label class="cursor-pointer group" @click="selected = 'N5'">
        <input type="radio" name="level" value="N5" class="sr-only" :required="!selected">
        <div class="rounded-xl border-2 p-4 transition-all duration-150"
             :class="selected === 'N5'
               ? 'border-emerald-500 bg-emerald-50 shadow-sm'
               : 'border-gray-200 bg-white hover:border-emerald-300 hover:bg-emerald-50/40'">
          <div class="flex items-center justify-between mb-2.5">
            <span class="rounded-full bg-emerald-100 text-emerald-700 px-2.5 py-0.5 text-xs font-bold">N5</span>
            <svg class="transition-opacity" :class="selected === 'N5' ? 'opacity-100 text-emerald-500' : 'opacity-0'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <p class="font-semibold text-gray-900 text-sm">Mới bắt đầu</p>
          <p class="text-xs text-gray-500 mt-1 leading-relaxed">100 từ vựng · 80 Kanji · Ngữ pháp cơ bản</p>
          <div class="mt-3 space-y-1">
            <p class="text-[11px] text-emerald-600 font-medium flex items-center gap-1">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
              Từ vựng N5
            </p>
            <p class="text-[11px] text-emerald-600 font-medium flex items-center gap-1">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
              Kanji 80 chữ cơ bản
            </p>
            <p class="text-[11px] text-emerald-600 font-medium flex items-center gap-1">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
              Đề thi N5 thật
            </p>
          </div>
        </div>
      </label>

      <!-- N4 -->
      <label class="cursor-pointer group" @click="selected = 'N4'">
        <input type="radio" name="level" value="N4" class="sr-only">
        <div class="rounded-xl border-2 p-4 transition-all duration-150"
             :class="selected === 'N4'
               ? 'border-teal-500 bg-teal-50 shadow-sm'
               : 'border-gray-200 bg-white hover:border-teal-300 hover:bg-teal-50/40'">
          <div class="flex items-center justify-between mb-2.5">
            <span class="rounded-full bg-teal-100 text-teal-700 px-2.5 py-0.5 text-xs font-bold">N4</span>
            <svg class="transition-opacity" :class="selected === 'N4' ? 'opacity-100 text-teal-500' : 'opacity-0'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <p class="font-semibold text-gray-900 text-sm">Sơ cấp</p>
          <p class="text-xs text-gray-500 mt-1 leading-relaxed">300 từ vựng · 170 Kanji · Giao tiếp cơ bản</p>
          <div class="mt-3 space-y-1">
            <p class="text-[11px] text-teal-600 font-medium flex items-center gap-1">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
              Toàn bộ nội dung N5
            </p>
            <p class="text-[11px] text-teal-600 font-medium flex items-center gap-1">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
              Từ vựng & Kanji N4
            </p>
            <p class="text-[11px] text-teal-600 font-medium flex items-center gap-1">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
              Đề thi N4 thật
            </p>
          </div>
        </div>
      </label>

      <!-- N3 -->
      <label class="cursor-pointer group" @click="selected = 'N3'">
        <input type="radio" name="level" value="N3" class="sr-only">
        <div class="rounded-xl border-2 p-4 transition-all duration-150"
             :class="selected === 'N3'
               ? 'border-blue-500 bg-blue-50 shadow-sm'
               : 'border-gray-200 bg-white hover:border-blue-300 hover:bg-blue-50/40'">
          <div class="flex items-center justify-between mb-2.5">
            <span class="rounded-full bg-blue-100 text-blue-700 px-2.5 py-0.5 text-xs font-bold">N3</span>
            <svg class="transition-opacity" :class="selected === 'N3' ? 'opacity-100 text-blue-500' : 'opacity-0'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <p class="font-semibold text-gray-900 text-sm">Trung cấp</p>
          <p class="text-xs text-gray-500 mt-1 leading-relaxed">650 từ vựng · 370 Kanji · Đọc hiểu đa dạng</p>
          <div class="mt-3 space-y-1">
            <p class="text-[11px] text-blue-600 font-medium flex items-center gap-1">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
              Toàn bộ N5, N4
            </p>
            <p class="text-[11px] text-blue-600 font-medium flex items-center gap-1">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
              Từ vựng & Kanji N3
            </p>
            <p class="text-[11px] text-blue-600 font-medium flex items-center gap-1">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
              Đề thi N3 thật
            </p>
          </div>
        </div>
      </label>

      <!-- N2 -->
      <label class="cursor-pointer group" @click="selected = 'N2'">
        <input type="radio" name="level" value="N2" class="sr-only">
        <div class="rounded-xl border-2 p-4 transition-all duration-150"
             :class="selected === 'N2'
               ? 'border-indigo-500 bg-indigo-50 shadow-sm'
               : 'border-gray-200 bg-white hover:border-indigo-300 hover:bg-indigo-50/40'">
          <div class="flex items-center justify-between mb-2.5">
            <span class="rounded-full bg-indigo-100 text-indigo-700 px-2.5 py-0.5 text-xs font-bold">N2</span>
            <svg class="transition-opacity" :class="selected === 'N2' ? 'opacity-100 text-indigo-500' : 'opacity-0'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <p class="font-semibold text-gray-900 text-sm">Trung cấp cao</p>
          <p class="text-xs text-gray-500 mt-1 leading-relaxed">1500 từ vựng · 1000 Kanji · Đọc báo, xem phim</p>
          <div class="mt-3 space-y-1">
            <p class="text-[11px] text-indigo-600 font-medium flex items-center gap-1">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
              Toàn bộ N5, N4, N3
            </p>
            <p class="text-[11px] text-indigo-600 font-medium flex items-center gap-1">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
              Từ vựng & Kanji N2
            </p>
            <p class="text-[11px] text-indigo-600 font-medium flex items-center gap-1">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
              Đề thi N2 thật
            </p>
          </div>
        </div>
      </label>

      <!-- N1 -->
      <label class="cursor-pointer group sm:col-span-2 lg:col-span-1" @click="selected = 'N1'">
        <input type="radio" name="level" value="N1" class="sr-only">
        <div class="rounded-xl border-2 p-4 transition-all duration-150"
             :class="selected === 'N1'
               ? 'border-purple-500 bg-purple-50 shadow-sm'
               : 'border-gray-200 bg-white hover:border-purple-300 hover:bg-purple-50/40'">
          <div class="flex items-center justify-between mb-2.5">
            <span class="rounded-full bg-purple-100 text-purple-700 px-2.5 py-0.5 text-xs font-bold">N1</span>
            <svg class="transition-opacity" :class="selected === 'N1' ? 'opacity-100 text-purple-500' : 'opacity-0'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <p class="font-semibold text-gray-900 text-sm">Cao cấp</p>
          <p class="text-xs text-gray-500 mt-1 leading-relaxed">2000+ Kanji · Thành thạo hoàn toàn · Văn phong trang trọng</p>
          <div class="mt-3 space-y-1">
            <p class="text-[11px] text-purple-600 font-medium flex items-center gap-1">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
              Toàn bộ N5 → N2
            </p>
            <p class="text-[11px] text-purple-600 font-medium flex items-center gap-1">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
              2135 Kanji đầy đủ
            </p>
            <p class="text-[11px] text-purple-600 font-medium flex items-center gap-1">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
              Đề thi N1 thật
            </p>
          </div>
        </div>
      </label>

    </div>

    <!-- Submit -->
    <div class="flex flex-col items-center gap-3">
      <button type="submit"
              class="w-full max-w-xs rounded-xl px-6 py-3 text-sm font-semibold text-white transition-all"
              :class="selected
                ? 'bg-brand-600 hover:bg-brand-700 shadow-sm cursor-pointer'
                : 'bg-gray-300 cursor-not-allowed'"
              :disabled="!selected">
        <span x-show="!selected">Chọn một cấp độ để tiếp tục</span>
        <span x-show="selected">Bắt đầu học cấp <span x-text="selected"></span> →</span>
      </button>
      <p class="text-xs text-gray-400 text-center">Có thể thay đổi bất cứ lúc nào trong <strong>Cài đặt</strong></p>
    </div>
  </form>

</div>
{% endblock %}
